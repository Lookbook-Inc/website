name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: ["**"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only placeholders; CI does not connect to production services.
      NEXT_PUBLIC_WRAPPED_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_WRAPPED_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_WRAPPED_BACKEND_URL: http://127.0.0.1:8002
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
      NEXT_PUBLIC_POSTHOG_HOST: http://127.0.0.1:8003
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build
        run: npm run build
